<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12091f"><meta name="description" content=".vibes voice, chat, games and friends"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>.vibes V8</title></head><body><div id="app"><section id="auth" class="auth"><div class="logo">.vibes</div><p>Voice • Chat • Games • Friends</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="username" placeholder="Username for new account"><div class="row"><button id="signIn">Sign in</button><button id="signUp">Create account</button></div><small id="authMsg"></small></section><main id="main" hidden><header><div class="logo">.vibes</div><div class="top-icons"><button data-action="search">⌕</button><button data-action="rankings">🏆</button></div></header><nav class="tabs"><button class="active" data-action="rooms">Chatrooms</button><button data-action="friends">Friends</button><button data-action="games">Games</button></nav><section id="roomsView"><div class="section-head"><div><h2>Live rooms</h2><p>Join a room and talk</p></div><button id="createRoom">＋ Create</button></div><div id="roomList" class="room-grid"></div></section><section id="profileCard" class="profile-card"><div class="avatar" id="myAvatar">U</div><div class="profile-info"><h3 id="myName">User</h3><span id="myGender">Member</span><div>ID: <b id="myId">—</b> <button class="mini" data-action="copyId">▣</button></div></div><button class="arrow" data-action="profile">›</button><div class="stats"><span><b>0</b>Friends</span><span><b>0</b>Following</span><span><b>0</b>Followers</span><span><b>0</b>Visitors</span></div><div class="gems">⭐ Available <b>My Gems 0.00</b></div><div class="menu-grid"><button data-action="store">🏪<span>My Store</span></button><button data-action="backpack">🎒<span>Backpack</span></button><button data-action="referral">🤝<span>Referral</span></button><button data-action="host">🎧<span>Host Center</span></button><button data-action="level">👑<span>Level</span></button><button data-action="help">🛟<span>Help</span></button><button data-action="settings">⚙️<span>Settings</span></button><button id="signOut">↪<span>Sign out</span></button></div></section><section id="roomView" hidden><div class="room-head"><button data-action="closeRoom">‹</button><div><b id="roomTitle">Room</b><small id="roomCount">0 people</small></div><div><button data-action="share">↗</button><button data-action="roomMore">⋯</button></div></div><div id="seats" class="seats"></div><div id="announcement" class="announcement">♡ Welcome to .vibes ⚡<small>Be respectful and have fun.</small></div><div id="messages" class="messages"></div><div class="room-controls"><button id="speakerBtn" data-action="speaker">🔊</button><button id="musicBtn" data-action="music">🎵</button><button id="micBtn" data-action="mic">🎙️</button></div><div class="composer"><input id="messageInput" placeholder="Say Something..."><button id="sendMessage">➤</button><button data-action="games">🎮</button><button data-action="emoji">😂</button></div></section></main><div id="modalRoot"></div><div id="toast" class="toast" hidden></div><input id="audioPicker" type="file" accept="audio/*" multiple hidden></div><script type="module" src="app.js"></script></body></html>
